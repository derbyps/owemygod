services:
  - type: web
    name: owemygod
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements-app.txt
    startCommand: uvicorn app.main:app_from_env --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: OWEMYGOD_DB
        value: /var/data/owemygod.db
      - key: SECRET_KEY
        generateValue: true
      - key: TINKER_API_KEY
        sync: false
      - key: OWEMYGOD_READER_PATH
        sync: false
      - key: OWEMYGOD_WRITER_PATH
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: OWNER_USERNAME
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: OWNER_TIMEZONE
        value: Asia/Makassar
